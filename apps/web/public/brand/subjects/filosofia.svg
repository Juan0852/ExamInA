<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Contenedor Base de Cristal -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="#0E1B2F" fill-opacity="0.85" stroke="url(#brand-grad)" stroke-width="2" />
  
  <!-- Círculo interior de profundidad -->
  <circle cx="32" cy="32" r="22" stroke="url(#brand-grad)" stroke-width="1" stroke-dasharray="4 4" opacity="0.25" fill="none" />
  
  <!-- Columna y destellos (Escalados) -->
  <g transform="translate(3.2, 3.2) scale(0.9)">
    <path d="M26 30 C 26 25, 30 22, 32 22 C 34 22, 38 25, 38 30 C 38 34, 35 36, 32 38 Z" fill="url(#brand-grad)" opacity="0.1" />

    <!-- Símbolo Principal: Columna Griega Clásica -->
    <!-- Base de la columna -->
    <rect x="18" y="48" width="28" height="4" rx="1" fill="#ffffff" />
    <rect x="20" y="44" width="24" height="4" fill="url(#brand-grad)" />

    <!-- Capitel de la columna (Volutas jónicas con brillo) -->
    <!-- Barra superior -->
    <rect x="20" y="20" width="24" height="3" rx="1" fill="#ffffff" />
    <!-- Voluta Izquierda -->
    <circle cx="22" cy="25" r="3.5" stroke="url(#brand-grad)" stroke-width="1.8" fill="none" filter="url(#neon-glow)" />
    <circle cx="22" cy="25" r="1" fill="#ffffff" />
    <!-- Voluta Derecha -->
    <circle cx="42" cy="25" r="3.5" stroke="url(#brand-grad)" stroke-width="1.8" fill="none" filter="url(#neon-glow)" />
    <circle cx="42" cy="25" r="1" fill="#ffffff" />
    <!-- Eje central del capitel -->
    <path d="M22 23 L42 23 L42 27 L22 27 Z" fill="url(#brand-grad)" opacity="0.4" />

    <!-- Fuste de la columna (Cuerpo estriado) -->
    <path d="M23 27 L41 27 L39 44 L25 44 Z" fill="url(#brand-grad)" opacity="0.15" />
    <rect x="23" y="27" width="18" height="17" stroke="#ffffff" stroke-width="2" fill="none" stroke-linejoin="round" />
    <!-- Estrías verticales -->
    <line x1="28" y1="29" x2="28" y2="42" stroke="#ffffff" stroke-width="1" opacity="0.6" />
    <line x1="32" y1="29" x2="32" y2="42" stroke="#ffffff" stroke-width="1" opacity="0.6" />
    <line x1="36" y1="29" x2="36" y2="42" stroke="#ffffff" stroke-width="1" opacity="0.6" />
    
    <!-- Destello de "Idea / Sabiduría" (Estrella en la parte superior) -->
    <path d="M32 10 L33.5 13.5 L37 15 L33.5 16.5 L32 20 L30.5 16.5 L27 15 L30.5 13.5 Z" fill="url(#brand-grad)" filter="url(#neon-glow)" />
    <circle cx="32" cy="15" r="1.5" fill="#ffffff" />
  </g>
</svg>
