<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Contenedor Base de Cristal -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="#0E1B2F" fill-opacity="0.85" stroke="url(#brand-grad)" stroke-width="2" />
  
  <!-- Círculo interior de profundidad -->
  <circle cx="32" cy="32" r="22" stroke="url(#brand-grad)" stroke-width="1" stroke-dasharray="4 4" opacity="0.25" fill="none" />

  <!-- Libro abierto y pluma (Escalados) -->
  <g transform="translate(-4.8, -3.1) scale(1.15)">
    <path d="M15 42 C 24 38, 28 42, 32 40 C 36 42, 40 38, 49 42 L 49 22 C 40 18, 36 22, 32 20 C 28 22, 24 18, 15 22 Z" fill="url(#brand-grad)" opacity="0.15" />
    
    <!-- Contornos del Libro Abierto -->
    <path d="M15 44 C 24 40, 28 44, 32 42 C 36 44, 40 40, 49 44 L 49 24 C 40 20, 36 24, 32 22 C 28 24, 24 20, 15 24 Z" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <line x1="32" y1="22" x2="32" y2="42" stroke="#ffffff" stroke-width="1.5" />
    
    <!-- Líneas de Escritura en el Libro (Lado Izquierdo) -->
    <line x1="19" y1="28" x2="28" y2="28" stroke="#ffffff" stroke-width="1" opacity="0.4" stroke-linecap="round" />
    <line x1="19" y1="32" x2="27" y2="32" stroke="#ffffff" stroke-width="1" opacity="0.4" stroke-linecap="round" />
    <line x1="19" y1="36" x2="29" y2="36" stroke="#ffffff" stroke-width="1" opacity="0.4" stroke-linecap="round" />

    <!-- Líneas de Escritura en el Libro (Lado Derecho) -->
    <line x1="36" y1="28" x2="45" y2="28" stroke="#ffffff" stroke-width="1" opacity="0.4" stroke-linecap="round" />
    <line x1="36" y1="32" x2="43" y2="32" stroke="#ffffff" stroke-width="1" opacity="0.4" stroke-linecap="round" />
    <line x1="36" y1="36" x2="44" y2="36" stroke="#ffffff" stroke-width="1" opacity="0.4" stroke-linecap="round" />

    <!-- Símbolo Principal: Pluma Estilográfica Cruzada -->
    <!-- Tinta / Pluma -->
    <path d="M43 17 L25 35 L23 41 L29 39 L47 21 Z" fill="url(#brand-grad)" filter="url(#neon-glow)" opacity="0.3" />
    <!-- Eje principal de la pluma -->
    <line x1="45" y1="15" x2="23" y2="37" stroke="url(#brand-grad)" stroke-width="2.5" stroke-linecap="round" filter="url(#neon-glow)" />
    <!-- Punta metálica de la pluma -->
    <path d="M23 37 L21 41 L25 39 Z" fill="#ffffff" stroke="#ffffff" stroke-width="1" />
    <line x1="22.5" y1="38" x2="24" y2="39.5" stroke="#0E1B2F" stroke-width="0.8" />
    <!-- Mango / Diseño de la pluma -->
    <path d="M38 22 C39 21, 41 23, 40 24 L45 19 C46 18, 47 19, 46 20 Z" fill="#ffffff" />
    
    <!-- Trazado de tinta flotando -->
    <path d="M21 41 Q 18 43, 22 46 T 25 43" stroke="url(#brand-grad)" stroke-width="1.5" fill="none" stroke-linecap="round" filter="url(#neon-glow)" />
  </g>
</svg>
