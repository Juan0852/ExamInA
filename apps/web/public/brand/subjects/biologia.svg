<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Contenedor Base de Cristal -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="#0E1B2F" fill-opacity="0.85" stroke="url(#brand-grad)" stroke-width="2" />
  
  <!-- Círculo interior de profundidad -->
  <circle cx="32" cy="32" r="22" stroke="url(#brand-grad)" stroke-width="1" stroke-dasharray="4 4" opacity="0.25" fill="none" />
  
  <!-- Símbolo Principal: ADN y Hoja (Escalados) -->
  <g transform="translate(4.8, 1.4) scale(0.85)">
    <!-- Hebras del ADN (Vertical) -->
    <!-- Hebra 1 -->
    <path d="M26 16 C38 24, 38 28, 26 36 C14 44, 14 48, 26 56" stroke="url(#brand-grad)" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#neon-glow)" />
    <!-- Hebra 2 -->
    <path d="M38 16 C26 24, 26 28, 38 36 C50 44, 50 48, 38 56" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" />
    
    <!-- Peldaños / Enlaces del ADN -->
    <line x1="30" y1="18.5" x2="34" y2="18.5" stroke="url(#brand-grad)" stroke-width="1.5" opacity="0.7" />
    <line x1="32" y1="26" x2="32" y2="26" stroke="#ffffff" stroke-width="1.5" />
    <line x1="28" y1="33.5" x2="36" y2="33.5" stroke="url(#brand-grad)" stroke-width="1.5" opacity="0.7" />
    <line x1="32" y1="41" x2="32" y2="41" stroke="#ffffff" stroke-width="1.5" />
    <line x1="30" y1="48.5" x2="34" y2="48.5" stroke="url(#brand-grad)" stroke-width="1.5" opacity="0.7" />

    <!-- Nodos de conexión (Bolas de fósforo) -->
    <circle cx="26" cy="16" r="2.5" fill="url(#brand-grad)" />
    <circle cx="38" cy="16" r="2.5" fill="#ffffff" />
    <circle cx="32" cy="26" r="2.5" fill="url(#brand-grad)" />
    <circle cx="26" cy="36" r="2.5" fill="url(#brand-grad)" />
    <circle cx="38" cy="36" r="2.5" fill="#ffffff" />
    <circle cx="32" cy="46" r="2.5" fill="url(#brand-grad)" />
    <circle cx="26" cy="56" r="2.5" fill="url(#brand-grad)" />
    <circle cx="38" cy="56" r="2.5" fill="#ffffff" />

    <!-- Hoja Orgánica cruzando en diagonal -->
    <path d="M18 42 C24 34, 38 32, 46 22 C36 32, 34 34, 22 38 Z" fill="url(#brand-grad)" filter="url(#neon-glow)" />
    <!-- Nervio central de la hoja -->
    <path d="M18 42 C28 36, 38 30, 46 22" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" />
  </g>
</svg>
