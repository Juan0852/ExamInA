<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Contenedor Base de Cristal -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="#0E1B2F" fill-opacity="0.85" stroke="url(#brand-grad)" stroke-width="2" />
  
  <!-- Círculo interior de profundidad -->
  <circle cx="32" cy="32" r="22" stroke="url(#brand-grad)" stroke-width="1" stroke-dasharray="4 4" opacity="0.25" fill="none" />

  <!-- Escuadras y lápiz (Escalados) -->
  <g transform="translate(-8, -8) scale(1.25)">
    <line x1="16" y1="20" x2="48" y2="20" stroke="url(#brand-grad)" stroke-width="0.8" opacity="0.12" />
    <line x1="16" y1="32" x2="48" y2="32" stroke="url(#brand-grad)" stroke-width="0.8" opacity="0.12" />
    <line x1="16" y1="44" x2="48" y2="44" stroke="url(#brand-grad)" stroke-width="0.8" opacity="0.12" />
    <line x1="20" y1="16" x2="20" y2="48" stroke="url(#brand-grad)" stroke-width="0.8" opacity="0.12" />
    <line x1="32" y1="16" x2="32" y2="48" stroke="url(#brand-grad)" stroke-width="0.8" opacity="0.12" />
    <line x1="44" y1="16" x2="44" y2="48" stroke="url(#brand-grad)" stroke-width="0.8" opacity="0.12" />

    <!-- Símbolo Principal: Escuadra y Cartabón -->
    <!-- Cartabón (Escuadra de 30-60-90 en diagonal izquierda) -->
    <path d="M16 44 L16 20 L30 44 Z" fill="url(#brand-grad)" opacity="0.18" />
    <path d="M16 44 L16 20 L30 44 Z" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round" fill="none" />
    <!-- Agujero interior del cartabón -->
    <path d="M19 41 L19 28 L25 41 Z" stroke="#ffffff" stroke-width="1" fill="none" opacity="0.5" />

    <!-- Escuadra (Isósceles de 45 en diagonal derecha) -->
    <!-- Relleno de la escuadra con resplandor neón -->
    <path d="M22 42 L42 22 L42 42 Z" fill="url(#brand-grad)" filter="url(#neon-glow)" opacity="0.3" />
    <!-- Contorno de la escuadra -->
    <path d="M22 42 L42 22 L42 42 Z" stroke="url(#brand-grad)" stroke-width="2.2" stroke-linejoin="round" fill="none" filter="url(#neon-glow)" />
    <!-- Agujero interior de la escuadra -->
    <path d="M28 39 L39 28 L39 39 Z" stroke="url(#brand-grad)" stroke-width="1.2" fill="none" filter="url(#neon-glow)" />

    <!-- Calibrador / Lápiz mecánico de dibujo cruzado -->
    <line x1="45" y1="17" x2="25" y2="37" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <!-- Punta fina del portaminas -->
    <polygon points="25,37 23,41 27,39" fill="#ffffff" />
  </g>
</svg>
