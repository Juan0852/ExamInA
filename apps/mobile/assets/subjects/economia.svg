<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Contenedor Base de Cristal -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="#0E1B2F" fill-opacity="0.85" stroke="url(#brand-grad)" stroke-width="2" />
  
  <!-- Círculo interior de profundidad -->
  <circle cx="32" cy="32" r="22" stroke="url(#brand-grad)" stroke-width="1" stroke-dasharray="4 4" opacity="0.25" fill="none" />
  
  <!-- Gráfico y monedas (Escalados) -->
  <g transform="translate(-4.6, -4.6) scale(1.15)">
    <!-- Barras del Gráfico (Fondo) -->
    <!-- Barra 1 -->
    <rect x="18" y="38" width="4" height="8" rx="1" fill="url(#brand-grad)" opacity="0.25" />
    <!-- Barra 2 -->
    <rect x="25" y="32" width="4" height="14" rx="1" fill="url(#brand-grad)" opacity="0.25" />
    <!-- Barra 3 -->
    <rect x="32" y="27" width="4" height="19" rx="1" fill="url(#brand-grad)" opacity="0.25" />
    <!-- Barra 4 -->
    <rect x="39" y="20" width="4" height="26" rx="1" fill="url(#brand-grad)" opacity="0.25" />

    <!-- Ejes del gráfico -->
    <line x1="14" y1="46" x2="48" y2="46" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.6" />
    <line x1="14" y1="16" x2="14" y2="46" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.6" />

    <!-- Línea de Tendencia Alcista (Brillante) -->
    <path d="M14 42 L25 35 L32 30 L43 21 L48 16" fill="none" stroke="url(#brand-grad)" stroke-width="3" stroke-linecap="round" filter="url(#neon-glow)" />
    <!-- Flecha de la tendencia -->
    <path d="M42 16 H 48 V 22" fill="none" stroke="url(#brand-grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon-glow)" />
    
    <!-- Moneda con Símbolo Porcentaje o Euro (Frente) -->
    <circle cx="44" cy="34" r="7.5" fill="#0E1B2F" stroke="url(#brand-grad)" stroke-width="2" filter="url(#neon-glow)" />
    <circle cx="44" cy="34" r="6" fill="url(#brand-grad)" opacity="0.3" />
    <!-- Símbolo de porcentaje % dentro de la moneda -->
    <text x="44" y="37" font-family="system-ui, sans-serif" font-weight="900" font-size="8" text-anchor="middle" fill="#ffffff">%</text>
    
    <!-- Otra moneda trasera de soporte -->
    <path d="M37 32 A 7.5 7.5 0 0 0 46 39" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.6" />
  </g>
</svg>
