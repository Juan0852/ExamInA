<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Contenedor Base de Cristal -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="#0E1B2F" fill-opacity="0.85" stroke="url(#brand-grad)" stroke-width="2" />
  
  <!-- Círculo interior de profundidad -->
  <circle cx="32" cy="32" r="22" stroke="url(#brand-grad)" stroke-width="1" stroke-dasharray="4 4" opacity="0.25" fill="none" />
  
  <!-- Globo terráqueo y soporte (Escalados) -->
  <g transform="translate(4.8, 2.5) scale(0.85)">
    <!-- Soporte Metálico del Globo (Fondo) -->
    <path d="M32 50 A 18 18 0 0 1 14 32" stroke="url(#brand-grad)" stroke-width="2" fill="none" opacity="0.4" />
    <path d="M32 50 V 54 H 26 V 56 H 38 V 54 H 32" stroke="url(#brand-grad)" stroke-width="2.2" stroke-linejoin="round" fill="none" opacity="0.4" />

    <!-- Esfera del Globo (Cuerpo principal) -->
    <!-- Océano (Base del círculo) -->
    <circle cx="32" cy="32" r="15" fill="url(#brand-grad)" filter="url(#neon-glow)" opacity="0.15" />
    <circle cx="32" cy="32" r="15" stroke="#ffffff" stroke-width="2" fill="none" />
    
    <!-- Líneas de Latitud / Grid -->
    <path d="M17 32 H 47" stroke="#ffffff" stroke-width="1" opacity="0.4" />
    <path d="M19 25 C 24 28, 40 28, 45 25" stroke="#ffffff" stroke-width="0.8" opacity="0.3" fill="none" />
    <path d="M19 39 C 24 36, 40 36, 45 39" stroke="#ffffff" stroke-width="0.8" opacity="0.3" fill="none" />
    
    <!-- Líneas de Longitud / Meridianos -->
    <path d="M32 17 A 15 15 0 0 0 32 47" stroke="#ffffff" stroke-width="1.2" opacity="0.5" fill="none" />
    <path d="M32 17 A 24 24 0 0 0 32 47" stroke="#ffffff" stroke-width="0.8" opacity="0.3" fill="none" />
    <path d="M32 17 A 24 24 0 0 1 32 47" stroke="#ffffff" stroke-width="0.8" opacity="0.3" fill="none" />

    <!-- Siluetas de Continentes (Trazado simplificado premium) -->
    <!-- América/Europa/África simplificada -->
    <path d="M22 23 C 24 23, 26 21, 28 24 C 27 26, 25 28, 27 30 C 29 28, 30 26, 33 26 C 36 29, 34 32, 36 34 C 34 37, 30 38, 28 35 C 26 33, 22 34, 22 28 Z" fill="url(#brand-grad)" filter="url(#neon-glow)" opacity="0.65" />
    <path d="M39 21 C 41 21, 44 20, 44 23 C 42 25, 41 27, 43 28 C 45 26, 46 25, 47 27 C 45 29, 43 32, 41 35 C 38 32, 37 28, 39 25 Z" fill="url(#brand-grad)" filter="url(#neon-glow)" opacity="0.65" />
    
    <!-- Rosa de los vientos / Brújula (Esquina superior derecha) -->
    <g transform="translate(48, 16)">
      <circle cx="0" cy="0" r="4.5" fill="#0E1B2F" stroke="url(#brand-grad)" stroke-width="1" />
      <line x1="0" y1="-5.5" x2="0" y2="5.5" stroke="#ffffff" stroke-width="1.2" />
      <line x1="-5.5" y1="0" x2="5.5" y2="0" stroke="#ffffff" stroke-width="1.2" />
      <!-- Aguja roja/blanca simplificada (Cian de marca) -->
      <polygon points="0,-4.5 1.5,0 -1.5,0" fill="url(#brand-grad)" filter="url(#neon-glow)" />
    </g>
  </g>
</svg>
