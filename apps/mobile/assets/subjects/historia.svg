<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Contenedor Base de Cristal -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="#0E1B2F" fill-opacity="0.85" stroke="url(#brand-grad)" stroke-width="2" />
  
  <!-- Círculo interior de profundidad -->
  <circle cx="32" cy="32" r="22" stroke="url(#brand-grad)" stroke-width="1" stroke-dasharray="4 4" opacity="0.25" fill="none" />
  
  <!-- Castillo y escudo (Escalados) -->
  <g transform="translate(-4.8, -4.6) scale(1.15)">
    <path d="M18 42 H46 V32 L42 28 V24 H38 V28 L32 24 L26 28 V24 H22 V28 L18 32 Z" fill="url(#brand-grad)" opacity="0.08" />

    <!-- Símbolo Principal: Escudo Heráldico y Espada Cruzada -->
    <!-- Espada (Diagonal) -->
    <!-- Hoja de la espada -->
    <line x1="20" y1="44" x2="44" y2="20" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <line x1="20.5" y1="43.5" x2="43.5" y2="20.5" stroke="#0E1B2F" stroke-width="0.8" />
    <!-- Empuñadura / Hilt -->
    <line x1="17" y1="41" x2="23" y2="47" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <circle cx="16.5" cy="47.5" r="1.5" fill="#ffffff" />

    <!-- Escudo Heráldico (En el frente con brillo neón) -->
    <!-- Relleno translúcido del escudo -->
    <path d="M22 18 C30 18, 32 15, 32 15 C32 15, 34 18, 42 18 C42 30, 38 40, 32 47 C26 40, 22 30, 22 18 Z" fill="url(#brand-grad)" filter="url(#neon-glow)" opacity="0.35" />
    <!-- Contorno del escudo -->
    <path d="M22 18 C30 18, 32 15, 32 15 C32 15, 34 18, 42 18 C42 30, 38 40, 32 47 C26 40, 22 30, 22 18 Z" stroke="url(#brand-grad)" stroke-width="2.2" stroke-linejoin="round" fill="none" filter="url(#neon-glow)" />
    
    <!-- Detalles dentro del escudo (Una corona o blasón minimalista) -->
    <path d="M28 28 L32 23 L36 28 L34 26 L30 26 Z" fill="#ffffff" />
    <circle cx="32" cy="32" r="2.5" fill="#ffffff" />
  </g>
</svg>
