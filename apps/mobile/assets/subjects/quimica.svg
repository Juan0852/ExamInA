<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" opacity="0.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Contenedor Base de Cristal -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="#0E1B2F" fill-opacity="0.85" stroke="url(#brand-grad)" stroke-width="2" />
  
  <!-- Círculo interior de profundidad -->
  <circle cx="32" cy="32" r="22" stroke="url(#brand-grad)" stroke-width="1" stroke-dasharray="4 4" opacity="0.25" fill="none" />
  
  <!-- Símbolos Químicos: Enlace Hexagonal y Matraz (Escalados) -->
  <g transform="translate(4.8, 4.8) scale(0.85)">
    <path d="M42 22 L50 27 L50 37 L42 42 L34 37 L34 27 Z" stroke="url(#brand-grad)" stroke-width="1" fill="none" opacity="0.2" />
    <circle cx="42" cy="22" r="1.5" fill="url(#brand-grad)" opacity="0.3" />
    <circle cx="50" cy="27" r="1.5" fill="url(#brand-grad)" opacity="0.3" />
    <circle cx="50" cy="37" r="1.5" fill="url(#brand-grad)" opacity="0.3" />
    <circle cx="42" cy="42" r="1.5" fill="url(#brand-grad)" opacity="0.3" />

    <!-- Símbolo Principal: Matraz Erlenmeyer -->
    <!-- Líquido interno (Lleno al 40%) -->
    <path d="M25 43 L39 43 L42 49 C43 51, 41 52, 38 52 L26 52 C23 52, 21 51, 22 49 Z" fill="url(#brand-grad)" filter="url(#neon-glow)" opacity="0.4" />
    <line x1="25" y1="43" x2="39" y2="43" stroke="#00F2FE" stroke-width="1" opacity="0.6" />

    <!-- Cuerpo del Matraz (Contorno) -->
    <path d="M29 20 L35 20 M31 20 L31 28 L43 49 C45 53, 42 54, 38 54 L26 54 C22 54, 19 53, 21 49 L33 28 L33 20" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" fill="none" />
    <line x1="28" y1="18.5" x2="36" y2="18.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

    <!-- Burbujas del Líquido (Ascendiendo) -->
    <circle cx="32" cy="34" r="2" fill="#ffffff" opacity="0.8" />
    <circle cx="28" cy="47" r="2.5" fill="#ffffff" opacity="0.6" />
    <circle cx="35" cy="45" r="1.5" fill="url(#brand-grad)" />
    <circle cx="31" cy="48" r="1" fill="#ffffff" />
    
    <!-- Burbujas que salen del matraz -->
    <circle cx="33" cy="14" r="2" fill="url(#brand-grad)" filter="url(#neon-glow)" />
    <circle cx="30" cy="10" r="1" fill="#ffffff" />
  </g>
</svg>
