<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Degradado principal de marca -->
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>
    <!-- Filtro de resplandor neón -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Contenedor Base de Cristal -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="#0E1B2F" fill-opacity="0.85" stroke="url(#brand-grad)" stroke-width="2" />
  
  <!-- Círculo interior de profundidad -->
  <circle cx="32" cy="32" r="22" stroke="url(#brand-grad)" stroke-width="1" stroke-dasharray="4 4" opacity="0.25" fill="none" />
  
  <!-- Símbolos del Gráfico / Curvas de función (Fondo) y Compás (Escalados) -->
  <g transform="translate(-8, -3.6) scale(1.25)">
    <path d="M16 44 C 24 20, 28 44, 48 20" stroke="url(#brand-grad)" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4" />
    <line x1="16" y1="44" x2="48" y2="44" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.2" stroke-dasharray="2 2" />
    <line x1="16" y1="20" x2="16" y2="44" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.2" stroke-dasharray="2 2" />

    <!-- Símbolo Principal: Compás y Regla -->
    <!-- Regla Diagonal -->
    <path d="M18 42 L42 18 L46 22 L22 46 Z" fill="url(#brand-grad)" opacity="0.25" />
    <line x1="20" y1="40" x2="40" y2="20" stroke="url(#brand-grad)" stroke-width="1.5" stroke-linecap="round" />
    <!-- Marcas de la regla -->
    <line x1="24" y1="36" x2="27" y2="39" stroke="url(#brand-grad)" stroke-width="1" />
    <line x1="28" y1="32" x2="31" y2="35" stroke="url(#brand-grad)" stroke-width="1" />
    <line x1="32" y1="28" x2="35" y2="31" stroke="url(#brand-grad)" stroke-width="1" />
    <line x1="36" y1="24" x2="39" y2="27" stroke="url(#brand-grad)" stroke-width="1" />

    <!-- Compás -->
    <!-- Cabeza y bisagra del compás -->
    <circle cx="32" cy="18" r="3" fill="#ffffff" filter="url(#neon-glow)" />
    <path d="M32 15 L32 18" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <!-- Brazo Izquierdo (Punta metálica) -->
    <path d="M32 18 L24 42" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <!-- Brazo Derecho (Punto de lápiz) -->
    <path d="M32 18 L38 36 L40 42" stroke="url(#brand-grad)" stroke-width="2.5" stroke-linecap="round" filter="url(#neon-glow)" />
    <circle cx="40" cy="42" r="1.5" fill="#00F2FE" />
    
    <!-- Arco trazado por el compás -->
    <path d="M24 42 A 18 18 0 0 0 40 42" stroke="#ffffff" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.5" fill="none" />
  </g>
</svg>
