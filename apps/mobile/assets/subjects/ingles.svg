<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Contenedor Base de Cristal -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="#0E1B2F" fill-opacity="0.85" stroke="url(#brand-grad)" stroke-width="2" />
  
  <!-- Círculo interior de profundidad -->
  <circle cx="32" cy="32" r="22" stroke="url(#brand-grad)" stroke-width="1" stroke-dasharray="4 4" opacity="0.25" fill="none" />
  
  <!-- Bocadillos y mapa global (Escalados) -->
  <g transform="translate(-4.8, -2.5) scale(1.15)">
    <circle cx="32" cy="32" r="16" stroke="url(#brand-grad)" stroke-width="1" opacity="0.18" fill="none" />
    <path d="M16 32 H 48 M32 16 V 48" stroke="url(#brand-grad)" stroke-width="1" opacity="0.12" />
    <path d="M20 23 A 16 16 0 0 0 20 41 M44 23 A 16 16 0 0 1 44 41" stroke="url(#brand-grad)" stroke-width="1" opacity="0.12" fill="none" />

    <!-- Símbolo Principal: Dos Bocadillos de Diálogo Entrelazados -->
    <!-- Bocadillo 2 (Fondo izquierdo - Pequeño) -->
    <path d="M18 36 C18 41, 23 43, 26 43 L24 47 L29 44 C33 44, 36 41, 36 36 C36 31, 33 29, 27 29 C21 29, 18 31, 18 36 Z" stroke="#ffffff" stroke-width="1.8" fill="#0E1B2F" fill-opacity="0.9" opacity="0.85" />
    <!-- Letra 'A' en bocadillo secundario -->
    <text x="27" y="38" font-family="system-ui, sans-serif" font-weight="900" font-size="8" text-anchor="middle" fill="#ffffff" opacity="0.8">A</text>

    <!-- Bocadillo 1 (Frente derecho - Grande con resplandor) -->
    <path d="M28 28 C28 21, 34 19, 41 19 C48 19, 50 22, 50 28 C50 34, 46 36, 42 36 L36 41 L39 36 C33 36, 28 34, 28 28 Z" fill="url(#brand-grad)" filter="url(#neon-glow)" opacity="0.3" />
    <path d="M28 28 C28 21, 34 19, 41 19 C48 19, 50 22, 50 28 C50 34, 46 36, 42 36 L36 41 L39 36 C33 36, 28 34, 28 28 Z" stroke="url(#brand-grad)" stroke-width="2.2" fill="none" filter="url(#neon-glow)" />
    <!-- Letra 'E' / 'Hi' en bocadillo principal -->
    <text x="39" y="31" font-family="system-ui, sans-serif" font-weight="900" font-size="10" text-anchor="middle" fill="#ffffff" filter="url(#neon-glow)">hi</text>
    
    <!-- Tres puntos de conversación flotantes -->
    <circle cx="48" cy="12" r="1.5" fill="url(#brand-grad)" />
    <circle cx="52" cy="15" r="1" fill="#ffffff" />
  </g>
</svg>
