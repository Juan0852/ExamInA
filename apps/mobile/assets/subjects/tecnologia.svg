<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Contenedor Base de Cristal -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="#0E1B2F" fill-opacity="0.85" stroke="url(#brand-grad)" stroke-width="2" />
  
  <!-- Círculo interior de profundidad -->
  <circle cx="32" cy="32" r="22" stroke="url(#brand-grad)" stroke-width="1" stroke-dasharray="4 4" opacity="0.25" fill="none" />
  
  <!-- Circuitos y engranajes (Escalados) -->
  <g transform="translate(-3.2, -3.1) scale(1.1)">
    <path d="M14 44 H 24 L 28 40 H 42 L 46 44 H 50" stroke="url(#brand-grad)" stroke-width="1" fill="none" opacity="0.2" />
    <circle cx="14" cy="44" r="1.5" fill="url(#brand-grad)" opacity="0.3" />
    <circle cx="50" cy="44" r="1.5" fill="url(#brand-grad)" opacity="0.3" />
    <circle cx="28" cy="40" r="1.5" fill="url(#brand-grad)" opacity="0.3" />

    <!-- Símbolo Principal: Engranajes Interconectados -->
    <!-- Engranaje 2 (Izquierdo inferior - Pequeño) -->
    <g transform="translate(25, 37)">
      <circle cx="0" cy="0" r="7" stroke="#ffffff" stroke-width="1.8" fill="#0E1B2F" fill-opacity="0.9" />
      <circle cx="0" cy="0" r="2" fill="#ffffff" />
      <!-- Dientes del engranaje -->
      <path d="M-1 -9 H1 V-7 H-1 Z M-1 7 H1 V9 H-1 Z M-9 -1 H-7 V1 H-9 Z M7 -1 H9 V1 H-7 Z" fill="#ffffff" />
      <path d="M-6 -6 L-5 -5 L-4 -7 L-5 -8 Z M4 4 L5 5 L6 4 L5 3 Z M-6 4 L-5 3 L-4 5 L-5 6 Z M4 -6 L5 -5 L6 -6 L5 -7 Z" fill="#ffffff" opacity="0.7" />
    </g>

    <!-- Engranaje 1 (Derecho superior - Grande con resplandor) -->
    <g transform="translate(39, 25)">
      <circle cx="0" cy="0" r="11" fill="url(#brand-grad)" filter="url(#neon-glow)" opacity="0.35" />
      <circle cx="0" cy="0" r="11" stroke="url(#brand-grad)" stroke-width="2.5" fill="none" filter="url(#neon-glow)" />
      <circle cx="0" cy="0" r="3.5" fill="#ffffff" />
      <!-- Dientes del engranaje grande -->
      <path d="M-1.5 -14 H1.5 V-11 H-1.5 Z M-1.5 11 H1.5 V14 H-1.5 Z M-14 -1.5 H-11 V1.5 H-14 Z M11 -1.5 H14 V1.5 H-11 Z" fill="url(#brand-grad)" filter="url(#neon-glow)" />
      <path d="M-10 -10 L-8 -8 L-7 -10 L-9 -11 Z M8 8 L10 10 L8 10 L7 8 Z M-10 8 L-8 8 L-8 10 L-10 10 Z M-10 8 L-8 8 L-8 10 L-10 10 Z" fill="url(#brand-grad)" filter="url(#neon-glow)" />
      <path d="M8 -10 L10 -8 L10 -10 L8 -11 Z" fill="url(#brand-grad)" filter="url(#neon-glow)" />
    </g>
  </g>
</svg>
